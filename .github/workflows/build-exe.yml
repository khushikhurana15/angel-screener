name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name AI_ML_Stock_Screener dashboard.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_ML_Stock_Screener-windows
          path: dist/AI_ML_Stock_Screener.exe
